# html-hub 바깥 감시: 5분마다 Cloudflare Worker(ops/worker)의 감시를 부른다.
# Worker 가 /healthz 와 원격 백업 나이를 보고 문제가 생기거나 풀리면 텔레그램으로 알린다.
# GitHub 크론은 몇 분 늦을 수 있고, 레포에 60일 동안 활동이 없으면 멈춘다 (Actions 화면에서 다시 켠다).
name: monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Worker 감시 부르기
        run: curl -fsS -m 60 -X POST -H "Authorization: Bearer ${{ secrets.MONITOR_SECRET }}" https://html-hub-ops.dmstjd1024.workers.dev/check
